    /* ---- Fungsi Helper Kurikulum & Prompt ---- */
    const daftarMapel = (jenjang, kelas) => {

    const daftarTP = (s) =>

    const kunciTeks = (q) => {
      if (q.bentuk === "pg") return HURUF[q.kunci] || "A";
      if (q.bentuk === "pgk") return (Array.isArray(q.kunci) ? q.kunci : []).map(i => HURUF[i]).join(", ");
      if (q.bentuk === "bs") return (q.pernyataan || []).map((p, i) => `${i + 1}:${p.benar ? "B" : "S"}`).join("; ");
      if (q.bentuk === "mj") return (q.kiri || []).map((k, i) => `${i + 1}→${HURUF[q.kunci?.[i] ?? 0]}`).join(", ");

    function acak(arr) {
      const idx = arr.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
      return idx;
    }

    function rancangSlot(s) {
      const urutanBentuk = ["pg", "pgk", "bs", "mj", "is", "ur"];
      const slots = [];
      let no = 1;
      urutanBentuk.forEach(b => {
        const jml = parseInt(s.jumlah?.[b], 10) || 0;
        for (let i = 0; i < jml; i++) {
          slots.push({ no: no++, bentuk: b });
        }
      });
      const n = slots.length;
      if (!n) return [];
      const pL = Number(s.proporsi?.lots ?? 30);
      const pM = Number(s.proporsi?.mots ?? 50);
      const nLots = Math.round((pL / 100) * n);
      const nMots = Math.round((pM / 100) * n);
      const tps = daftarTP(s);
      slots.forEach((sl, idx) => {
        if (idx < nLots) sl.level = "LOTS";
        else if (idx < nLots + nMots) sl.level = "MOTS";
        else sl.level = "HOTS";
        sl.tp = tps.length ? tps[idx % tps.length] : `Memahami materi ${namaMapel(s)} kelas ${s.kelas}`;
      });
      return slots;
    }

    function konteksPrompt(s) {
      const cps = cpTerpilih(s).map(c => `- [${c.kode}] ${c.teks}`).join("\n");

      return [
        `JENJANG & KELAS: ${JENJANG[s.jenjang]?.nama} Kelas ${s.kelas} (Fase ${faseSaatIni(s)})`,
        `MATA PELAJARAN: ${namaMapel(s)}`,
        `JENIS ASESMEN: ${JENIS[s.jenis]?.nama}`,
        cps ? `CAPAIAN PEMBELAJARAN (CP):\n${cps}` : "",
        s.materi.trim() ? `MATERI POKOK:\n${s.materi.trim()}` : "",
        tps ? `TUJUAN PEMBELAJARAN (TP):\n${tps}` : ""
      ].filter(Boolean).join("\n\n");
    }

    function bacaJSON(teks) {
      let clean = String(teks || "").trim();
      clean = clean.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
      try {
        return JSON.parse(clean);
      } catch (e) {
        const firstBrace = clean.indexOf("{");
        const firstBracket = clean.indexOf("[");
        let start = -1;
        let end = -1;
        if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
          start = firstBracket;
          end = clean.lastIndexOf("]");
        } else if (firstBrace !== -1) {
          start = firstBrace;
          end = clean.lastIndexOf("}");
        }
        if (start !== -1 && end !== -1 && end > start) {
          return JSON.parse(clean.slice(start, end + 1));
        }
        throw new Error("Format respons AI bukan JSON yang valid. Silakan coba lagi.");
      }
    }

    async function panggilAI(snap, userPrompt, sysPrompt) {
      const key = (snap.apiKey || "").trim();
      const model = snap.model || "gemini-3-flash-preview";
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: sysPrompt }] },
        generationConfig: {
          temperature: 0.7,
          responseMimeType: "application/json"
        }
      };

      let delay = 1000;
      for (let attempt = 0; attempt < 4; attempt++) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const data = await res.json();
          const out = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!out) throw new Error("AI tidak mengembalikan konten teks.");
          return out;
        }
        if (res.status === 429 || res.status >= 500) {
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
          continue;
        }
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson?.error?.message || `Gagal memanggil Gemini API (HTTP ${res.status})`);
      }
      throw new Error("Server AI sedang sibuk setelah beberapa percobaan. Coba lanjutkan beberapa saat lagi.");
    }

    async function buatBatch(snap, grup, existingSoal) {
      const opsiN = JENJANG[snap.jenjang]?.opsi || 4;

      ).join("\n");

      const prompt = `${konteksPrompt(snap)}

${ringkasanAda ? `SOAL YANG SUDAH DIBUAT (hindari pengulangan topik/angka persis): ${ringkasanAda}\n` : ""}
TUGAS: Susun ${grup.length} butir soal asesmen berkualitas tinggi sesuai kaidah penulisan soal Kurikulum Merdeka & AKM (Asesmen Kompetensi Minimum) untuk slot berikut:
${rincianSlot}

ATURAN FORMAT JSON (Keluarkan array JSON berisi objek soal dengan properti berikut):
- "no": number (sesuai nomor slot)
- "bentuk": string ("pg" | "pgk" | "bs" | "mj" | "is" | "ur")
- "level": string ("LOTS" | "MOTS" | "HOTS")
- "tp": string (tujuan pembelajaran yang diukur)
- "indikator": string (indikator soal operasional: Disajikan..., peserta didik dapat...)
- "stimulus": string (wacana singkat, tabel teks, atau konteks kehidupan nyata; wajib ada untuk soal HOTS/MOTS, boleh "" jika soal langsung)
- "soal": string (pokok pertanyaan yang jelas dan lugas dalam Bahasa Indonesia baku)
- "pembahasan": string (penjelasan langkah penyelesaian / alasan jawaban benar)

KHUSUS TIAP BENTUK:
1. Jika bentuk = "pg":
   - "opsi": array berisi tepat ${opsiN} string pilihan jawaban (tanpa huruf A/B/C di depannya)
   - "kunci": integer indeks jawaban benar (0 sampai ${opsiN - 1})
2. Jika bentuk = "pgk" (Pilihan Ganda Kompleks - jawaban benar lebih dari satu):
   - "opsi": array berisi ${opsiN} atau 5 string pilihan jawaban
   - "kunci": array integer indeks jawaban benar (minimal 2 indeks, misal [0, 2])
3. Jika bentuk = "bs" (Benar/Salah):
   - "pernyataan": array berisi 3 objek {"teks": string, "benar": boolean}
4. Jika bentuk = "mj" (Menjodohkan):
   - "kiri": array berisi 3 string premis/pertanyaan
   - "kanan": array berisi 4 string pilihan pasangan (acak urutannya, 1 sebagai pengecoh)
   - "kunci": array berisi 3 integer indeks pada "kanan" yang menjadi pasangan tepat untuk masing-masing item "kiri"
5. Jika bentuk = "is" (Isian Singkat):
   - "kunci": string jawaban singkat yang pasti
6. Jika bentuk = "ur" (Uraian):
   - "kunci": string uraian jawaban lengkap
   - "rubrik": array objek [{"skor": number, "kriteria": string}] dengan total skor maksimal ${snap.skor?.ur || 4}

Keluarkan HANYA array JSON valid.`;

      const raw = await panggilAI(
        snap,
        prompt,
        "Anda adalah penulis soal profesional Kurikulum Merdeka Kemendikdasmen Indonesia. Keluarkan hanya JSON valid tanpa markdown."
      );
      let arr = bacaJSON(raw);
      if (!Array.isArray(arr)) arr = arr.soal || arr.items || Object.values(arr)[0] || [];

      const hasil = [];
      grup.forEach((slot, idx) => {
        const item = arr.find(x => Number(x.no) === slot.no) || arr[idx];
        if (!item || !item.soal) return;
        const skorDefault = Number(snap.skor?.[slot.bentuk]) || BENTUK_INFO[slot.bentuk].skorDefault;
        const base = {
          no: slot.no,
          bentuk: slot.bentuk,
          target: slot.level,
          level: ["LOTS", "MOTS", "HOTS"].includes(String(item.level).toUpperCase()) ? String(item.level).toUpperCase() : slot.level,
          tp: String(item.tp || slot.tp).trim(),
          indikator: String(item.indikator || `Disajikan permasalahan kontekstual, peserta didik dapat menyelesaikan soal sesuai TP.`).trim(),
          stimulus: String(item.stimulus || "").trim(),
          soal: String(item.soal || "").trim(),
          pembahasan: String(item.pembahasan || "Sesuai konsep materi yang dipelajari.").trim(),
          skor: skorDefault
        };

        if (slot.bentuk === "pg") {
          const opsi = Array.isArray(item.opsi) && item.opsi.length >= 3 ? item.opsi.map(String) : ["Opsi A", "Opsi B", "Opsi C", "Opsi D"];
          let k = parseInt(item.kunci, 10);
          if (isNaN(k) || k < 0 || k >= opsi.length) k = 0;
          hasil.push({ ...base, opsi, kunci: k });
        } else if (slot.bentuk === "pgk") {
          const opsi = Array.isArray(item.opsi) && item.opsi.length >= 3 ? item.opsi.map(String) : ["Pernyataan 1", "Pernyataan 2", "Pernyataan 3", "Pernyataan 4"];
          let k = Array.isArray(item.kunci) ? item.kunci.map(Number).filter(i => i >= 0 && i < opsi.length) : [0, 1];
          if (k.length < 2) k = [0, 1];
          hasil.push({ ...base, opsi, kunci: [...new Set(k)].sort((a, b) => a - b) });
        } else if (slot.bentuk === "bs") {
          const pern = Array.isArray(item.pernyataan) && item.pernyataan.length >= 2
            ? item.pernyataan.map(p => ({ teks: String(p.teks || p), benar: Boolean(p.benar) }))
            : [{ teks: "Pernyataan pertama sesuai konsep.", benar: true }, { teks: "Pernyataan kedua bertentangan.", benar: false }];
          hasil.push({ ...base, pernyataan: pern });
        } else if (slot.bentuk === "mj") {
          const kiri = Array.isArray(item.kiri) && item.kiri.length >= 2 ? item.kiri.map(String) : ["Premis 1", "Premis 2"];
          const kanan = Array.isArray(item.kanan) && item.kanan.length >= kiri.length ? item.kanan.map(String) : [...kiri.map((_, i) => `Pasangan ${i + 1}`), "Pengecoh"];
          const kunci = Array.isArray(item.kunci) && item.kunci.length === kiri.length
            ? item.kunci.map((v, i) => (Number(v) >= 0 && Number(v) < kanan.length ? Number(v) : i))
            : kiri.map((_, i) => i);
          hasil.push({ ...base, kiri, kanan, kunci });
        } else if (slot.bentuk === "is") {
          hasil.push({ ...base, kunci: String(item.kunci || "-").trim() });
        } else {
          const rubrik = Array.isArray(item.rubrik) && item.rubrik.length
            ? item.rubrik.map(r => ({ skor: Number(r.skor) || 1, kriteria: String(r.kriteria || "") }))
            : [
                { skor: skorDefault, kriteria: "Menjawab lengkap, langkah sistematis, dan hasil akhir tepat." },
                { skor: Math.ceil(skorDefault / 2), kriteria: "Langkah sebagian tepat namun hasil akhir kurang lengkap." },
                { skor: 0, kriteria: "Tidak menjawab atau jawaban salah seluruhnya." }
              ];
          hasil.push({ ...base, kunci: String(item.kunci || "-").trim(), rubrik });
        }
      });

      return { hasil };
    }

    /* ---- Handler Proses AI & Sunting Soal ---- */
    async function buatSemua(lanjut = false) {
      if (store.sibuk) return;
      store.sibuk = true;
      store.batal = false;
      store.pesan = { jenis: "", teks: "" };

      let soal = lanjut ? [...store.S.soal] : [];
      upS({ step: 4, tab: "soal", soal });

      const snap = { ...store.S, soal };
      const rencana = rancangSlot(snap);
      const ada = new Set(soal.map(q => q.no));
      const antre = rencana.filter(s => !ada.has(s.no));
      const UK = 5;
      let galat = "";

      try {
        for (let i = 0; i < antre.length; i += UK) {
          if (store.batal) break;
          const grup = antre.slice(i, i + UK);
          store.status = {
            teks: `Menyusun soal nomor ${grup[0].no}–${grup[grup.length - 1].no} dari ${rencana.length} butir…`,
            frac: soal.length / rencana.length
          };
          render();
          const { hasil } = await buatBatch(snap, grup, soal);
          soal = soal.concat(hasil).sort((a, b) => a.no - b.no);
          snap.soal = soal;
          upS({ soal });
        }
      } catch (e) {
        galat = e.message;
      }

      store.sibuk = false;
      store.status = null;
      const kurang = rencana.length - soal.length;
      if (galat) {
        setInfo("err", galat + (soal.length ? ' Soal yang sudah jadi tetap tersimpan; tekan "Lanjutkan yang belum" untuk meneruskan.' : ""));
      } else if (store.batal) {
        setInfo("warn", `Proses dihentikan. ${soal.length} dari ${rencana.length} soal sudah jadi.`);
      } else if (kurang > 0) {
        setInfo("warn", `${kurang} soal belum berhasil dibuat. Tekan "Lanjutkan yang belum" untuk mencoba lagi.`);
      } else {
        setInfo("ok", `Selesai: ${soal.length} butir soal & perangkat asesmen berhasil disusun!`);
      }
    }

    async function gantiSoal(no) {
      if (store.sibuk) return;
      const snap = { ...store.S };
      const lama = snap.soal.find(q => q.no === no);
      if (!lama) return;
      const slot = rancangSlot(snap).find(s => s.no === no && s.bentuk === lama.bentuk) || {
        no,
        bentuk: lama.bentuk,
        level: lama.target || "MOTS",
        tp: lama.tp
      };
      store.sibuk = true;
      store.status = { teks: `Menyusun ulang soal nomor ${no}…`, frac: null };
      store.pesan = { jenis: "", teks: "" };
      render();

      try {
        const { hasil } = await buatBatch(snap, [slot], snap.soal);
        if (hasil.length) {
          upS(p => ({ soal: p.soal.map(q => (q.no === no ? hasil[0] : q)) }));
          setInfo("ok", `Soal nomor ${no} berhasil diperbarui.`);
        } else {
          setInfo("warn", "Soal pengganti gagal dibuat. Silakan coba lagi.");
        }
      } catch (e) {
        setInfo("err", e.message);
      }
      store.sibuk = false;
      store.status = null;
      render();
    }

    function bukaSunting(no) {
      const q = store.S.soal.find(x => x.no === no);
      if (!q) return;
      const f = {
        no,
        bentuk: q.bentuk,
        stimulus: q.stimulus,
        soal: q.soal,
        pembahasan: q.pembahasan,
        indikator: q.indikator,
        level: q.level,
        skor: q.skor,
        galat: ""
      };
      if (q.bentuk === "pg" || q.bentuk === "pgk") {
        f.opsi = (q.opsi || []).join("\n");
        f.kunci = kunciTeks(q);
      } else if (q.bentuk === "bs") {
        f.pern = (q.pernyataan || []).map(p => (p.benar ? "B|" : "S|") + p.teks).join("\n");
      } else if (q.bentuk === "mj") {
        f.pas = (q.kiri || []).map((k, i) => k + " | " + q.kanan[q.kunci[i]]).join("\n");
        f.peng = (q.kanan || []).filter((_, i) => !q.kunci.includes(i)).join("\n");
      } else {
        f.kunci = q.kunci;
      }
      store.sunting = f;
      render();
    }

    function simpanSunting() {
      const f = store.sunting;
      const q = store.S.soal.find(x => x.no === f.no);
      const g = t => {
        store.sunting = { ...f, galat: t };
        render();
      };
      const baris = v => String(v || "").split("\n").map(s => s.trim()).filter(Boolean);
      const n = {
        ...q,
        stimulus: f.stimulus.trim(),
        soal: f.soal.trim(),
        pembahasan: f.pembahasan.trim(),
        indikator: f.indikator.trim(),
        level: f.level,
        skor: Number(f.skor) || q.skor
      };
      if (!n.soal) return g("Pokok soal tidak boleh kosong.");

      if (q.bentuk === "pg" || q.bentuk === "pgk") {
        const o = baris(f.opsi);
        if (o.length < 3) return g("Minimal 3 pilihan jawaban.");
        const k = [...new Set(String(f.kunci).toUpperCase().split(/[^A-H]+/).filter(Boolean).map(h => HURUF.indexOf(h)))].sort((a, b) => a - b);
        if (!k.length || k.some(i => i < 0 || i >= o.length)) return g("Kunci harus berupa huruf pilihan yang tersedia (misal: A atau A, C).");
        if (q.bentuk === "pg" && k.length !== 1) return g("Pilihan ganda hanya punya satu kunci.");
        if (q.bentuk === "pgk" && (k.length < 2 || k.length >= o.length)) return g("Pilihan ganda kompleks perlu minimal dua kunci dan tidak semua pilihan.");
        n.opsi = o;
        n.kunci = q.bentuk === "pg" ? k[0] : k;
      } else if (q.bentuk === "bs") {
        const p = baris(f.pern).map(s => {
          const m = s.match(/^([BS])\s*\|\s*(.+)$/i);
          return m ? { benar: m[1].toUpperCase() === "B", teks: m[2].trim() } : null;
        });
        if (p.length < 2 || p.some(x => !x)) return g("Setiap baris pernyataan harus diawali B| atau S|.");
        n.pernyataan = p;
      } else if (q.bentuk === "mj") {
        const ps = baris(f.pas).map(s => s.split("|").map(x => x.trim()));
        if (ps.length < 2 || ps.some(x => x.length !== 2 || !x[0] || !x[1])) return g("Setiap baris harus berformat: premis kiri | jawaban kanan.");
        const kanan = ps.map(x => x[1]).concat(baris(f.peng));
        const urut = acak(kanan);
        n.kiri = ps.map(x => x[0]);
        n.kanan = urut.map(i => kanan[i]);
        n.kunci = ps.map((_, i) => urut.indexOf(i));
      } else {
        n.kunci = String(f.kunci).trim();
        if (!n.kunci) return g("Kunci jawaban tidak boleh kosong.");
        if (q.bentuk === "ur" && n.skor !== q.skor && q.rubrik) {
          const mx = Math.max(...q.rubrik.map(r => r.skor)) || 1;
          n.rubrik = q.rubrik.map(r => ({
            skor: Math.round((r.skor * n.skor) / mx * 10) / 10,
            kriteria: r.kriteria
          }));
        }
      }

      store.sunting = null;
      upS(p => ({ soal: p.soal.map(x => (x.no === f.no ? n : x)) }));
      setInfo("ok", `Butir soal nomor ${f.no} berhasil diperbarui.`);
    }

    function render() {
      const root = document.getElementById("app");

    /* ============================================================================
       9. EVENT DELEGATION (KLIK, INPUT, SUBMIT)
       ============================================================================ */
    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const act = btn.dataset.action;

      if (act === "switch-login") {
        store.loginTab = btn.dataset.tab;
        store.loginError = "";
        render();
      } else if (act === "logout") {
        await handleLogout();
      } else if (act === "nav-go") {
        store.nav = btn.dataset.nav;
        window.scrollTo(0, 0);
        render();
      } else if (act === "ke-langkah") {
        const st = Number(btn.dataset.step);
        if (st === 4 && !store.S.soal.length) {
          setInfo("warn", "Susun soal terlebih dahulu pada Langkah 3.");
          return;
        }
        upS({ step: st });
        store.pesan = { jenis: "", teks: "" };
        window.scrollTo(0, 0);
      } else if (act === "tutup-pesan") {
        setInfo("", "");
      } else if (act === "batal-ai") {
        store.batal = true;
      } else if (act === "sarankan-tp") {
        await sarankanTP();
      } else if (act === "buat-semua") {
        await buatSemua(false);
      } else if (act === "lanjut-buat") {
        await buatSemua(true);
      } else if (act === "ganti-tab") {
        upS({ tab: btn.dataset.tab });
      } else if (act === "ekspor-word-semua") {
        eksporWord(store.S, null);
      } else if (act === "ekspor-word-tab") {
        eksporWord(store.S, store.S.tab);
      } else if (act === "cetak-dok") {
        cetakDokumen();
      } else if (act === "simpan-cloud") {
        await simpanKeCloud();
      } else if (act === "muat-cloud") {
        const item = store.cloudPaket.find(x => x.id === btn.dataset.id);
        if (item) muatPaketDariCloud(item);
      } else if (act === "hapus-cloud") {
        await hapusPaketCloud(btn.dataset.id);
      } else if (act === "buka-sunting") {
        bukaSunting(Number(btn.dataset.no));
      } else if (act === "tutup-sunting") {
        store.sunting = null;
        render();
      } else if (act === "simpan-sunting") {
        simpanSunting();
      } else if (act === "ganti-soal") {
        await gantiSoal(Number(btn.dataset.no));
      } else if (act === "konfirm-reset") {
        store.konfirm = "baru";
        render();
      } else if (act === "batal-reset") {
        store.konfirm = "";
        render();
      } else if (act === "eksekusi-reset") {
        store.konfirm = "";
        upS({ soal: [], step: 1 });
        setInfo("ok", "Draft baru siap disusun.");
      } else if (act === "simpan-json") {
        const nm = `Proyek_${JENIS[store.S.jenis].singkat}_${namaMapel(store.S)}_${store.S.kelas}`.replace(/[^A-Za-z0-9]+/g, "_") + ".json";
        unduh(nm, [JSON.stringify({ ...store.S, apiKey: "" }, null, 2)], "application/json");
      }
    });

    document.addEventListener("change", (e) => {
      const el = e.target;
      if (el.dataset.action === "ganti-jenjang") {
        const jenjang = el.value;
        const kls = JENJANG[jenjang].kelas[0];
        const mp = daftarMapel(jenjang, kls);
        upS(p => ({
          jenjang,
          kelas: kls,
          mapel: mp.includes(p.mapel) ? p.mapel : mp[0],
          cpSel: [0]
        }));
      } else if (el.dataset.action === "ganti-kelas") {
        const kelas = el.value;
        const mp = daftarMapel(store.S.jenjang, kelas);
        upS(p => ({
          kelas,
          mapel: mp.includes(p.mapel) ? p.mapel : mp[0],
          cpSel: [0]
        }));
      } else if (el.dataset.action === "ganti-mapel") {
        upS({ mapel: el.value, cpSel: [0] });
      } else if (el.dataset.action === "toggle-cp") {
        const idx = Number(el.dataset.idx);
        const cur = Array.isArray(store.S.cpSel) ? [...store.S.cpSel] : [];
        const next = cur.includes(idx) ? cur.filter(i => i !== idx) : [...cur, idx];
        upS({ cpSel: next });
      } else if (el.dataset.action === "muat-json" && el.files?.[0]) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const d = JSON.parse(reader.result);
            upS(p => ({ ...JSON.parse(JSON.stringify(DEF)), ...d, apiKey: p.apiKey, model: p.model }));
            setInfo("ok", "File proyek JSON berhasil dimuat.");
          } catch (err) {
            setInfo("err", "File proyek JSON tidak valid.");
          }
        };
        reader.readAsText(el.files[0]);
      } else if (el.dataset.bind === "jenis") {
        const j = el.value;
        upS({ jenis: j, waktu: JENIS[j]?.waktuDefault || 90 });
      }
    });

    document.addEventListener("input", (e) => {
      const el = e.target;
      if (el.dataset.bind) {
        const key = el.dataset.bind;
        store.S[key] = el.value;
        try {
          localStorage.setItem("gsa_canvas", JSON.stringify(store.S));
        } catch (err) {}
      } else if (el.dataset.jumlah) {
        const b = el.dataset.jumlah;
        store.S.jumlah[b] = Math.max(0, parseInt(el.value, 10) || 0);
        try {
          localStorage.setItem("gsa_canvas", JSON.stringify(store.S));
        } catch (err) {}
        render();
      } else if (el.dataset.skor) {
        const b = el.dataset.skor;
        store.S.skor[b] = Math.max(1, parseInt(el.value, 10) || 1);
        try {
          localStorage.setItem("gsa_canvas", JSON.stringify(store.S));
        } catch (err) {}
      } else if (el.dataset.prop) {
        const k = el.dataset.prop;
        store.S.proporsi[k] = Math.max(0, Math.min(100, parseInt(el.value, 10) || 0));
        try {
          localStorage.setItem("gsa_canvas", JSON.stringify(store.S));
        } catch (err) {}
      } else if (el.dataset.sunting && store.sunting) {
        store.sunting[el.dataset.sunting] = el.value;
      }
    });

    document.addEventListener("submit", async (e) => {
      if (e.target.id === "form-login-guru") {
        e.preventDefault();
        const fd = new FormData(e.target);
        await handleLoginGuru(fd.get("username"), fd.get("password"));
      } else if (e.target.id === "form-login-admin") {
        e.preventDefault();
        const fd = new FormData(e.target);
        await handleLoginAdmin(fd.get("email"), fd.get("password"));
      } else if (e.target.id === "form-tambah-guru") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const baru = {
          username: String(fd.get("username") || "").trim(),
          password: String(fd.get("password") || "").trim(),
          nama_lengkap: String(fd.get("nama_lengkap") || "").trim(),
          unit_sekolah: store.S.sekolah,
          role: "guru"
        };
        if (!baru.username || !baru.password || !baru.nama_lengkap) return;
        try {
          if (USE_FIREBASE && fbDb) {
            await ensureFirebaseAuthSession();
            await addDoc(collection(fbDb, "artifacts", APP_ID, "public", "data", "users_guru"), {
              ...baru,
              created_at: serverTimestamp()
            });
          } else {
            store.guruList.push({ id: "g_" + Date.now(), ...baru });
          }
          e.target.reset();
          setInfo("ok", `Akun guru "${baru.nama_lengkap}" berhasil ditambahkan.`);
        } catch (err) {
          setInfo("err", "Gagal menambah guru: " + err.message);
        }
      }
    });

    /* ============================================================================
       10. INISIALISASI SAAT HALAMAN DIMUAT
       ============================================================================ */
    window.addEventListener("DOMContentLoaded", async () => {
      render();
      if (USE_FIREBASE) {
        await autoSetupDatabase();
        if (store.user) {
          startFirestoreListeners();
        }
      }
    });
  </script>
</body>
</html>
